<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>হাঙ্গুল শেখা — KoreanLearn</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f1115">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600;700&family=Noto+Sans+KR:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="container">
    <div class="font-controls" style="float:right"></div>
    <h1 class="page-title">ㅎ হাঙ্গুল শেখা</h1>
    <p class="page-sub">কোরিয়ান লিপির অক্ষরে ট্যাপ করে শব্দটি শুনুন।</p>
    <div id="voice-notice"></div>

    <div class="speed-controls"></div>

    <div class="section-title">🅰️ স্বরবর্ণ (모음)</div>
    <div class="hangul-grid" id="vowel-grid"></div>

    <div class="section-title">🅱️ ব্যঞ্জনবর্ণ (자음)</div>
    <div class="hangul-grid" id="consonant-grid"></div>

    <div class="section-title">🎮 অক্ষর চেনো গেম</div>
    <div class="card" id="hg-game" style="text-align:center">
      <div class="muted" id="hg-progress"></div>
      <div class="quiz-q" id="hg-question" style="cursor:pointer">
        <button class="btn btn-accent" id="hg-start">▶ খেলা শুরু করুন</button>
      </div>
      <div class="quiz-options" id="hg-options"></div>
      <button class="btn mt-16 hidden" id="hg-restart">🔁 আবার খেলুন</button>
    </div>
  </main>

  <script src="data/hangul.js"></script>
  <script src="js/app.js"></script>
  <script src="js/speech.js"></script>
  <script src="js/hangul.js"></script>
</body>
</html>
